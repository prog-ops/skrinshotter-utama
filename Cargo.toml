[package]
name = "skrinshotter"
version = "0.1.0"
edition = "2021"
description = "Cross-platform background screenshot, annotation, and metadata tool for Windows & macOS"

[dependencies]
arboard = "3.4"
chrono = "0.4"
dirs = "6.0"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
wgpu = "24"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
pollster = "0.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.26"
winit = "0.30"
xcap = "0.9"
